name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the previous run — no point finishing a build
# for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    name: pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev --python ${{ matrix.python-version }}

      # test_integration.py makes real API calls. Its cases self-skip when the
      # relevant key is unset, but there is no reason to pay for the network
      # timeouts in CI, so it is excluded outright.
      - name: Run tests
        run: uv run pytest tests/ --ignore=tests/test_integration.py -q

